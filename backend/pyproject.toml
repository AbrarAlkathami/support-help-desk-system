[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "AbrarAlkathami",email = "AbrarAlkathami@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
